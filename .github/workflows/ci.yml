name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jatin
          POSTGRES_PASSWORD: jatin
          POSTGRES_DB: jatin
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jatin:***@localhost:5432/jatin
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
      JWT_SECRET: ci-test-secret
      ADMIN_USERNAME: ciadmin
      ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run test

  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jatin
          POSTGRES_PASSWORD: jatin
          POSTGRES_DB: jatin
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jatin:***@localhost:5432/jatin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run db:deploy
      # 0002 creates jatin_app + all grants itself — the gate then validates
      # the schema against the law, not a promise.
      - run: npx tsx scripts/check-grants.mts
      - run: bash scripts/scan-tree.sh
