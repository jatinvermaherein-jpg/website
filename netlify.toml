# Jatin — CREW dashboard website on Netlify
# Site: https://portico-gateway.netlify.app
# API: proxies to Railway crew bus at website-production-0c80.up.railway.app

[build]
  publish = "apps/web"

[[redirects]]
  from = "/api/*"
  to = "https://website-production-0c80.up.railway.app/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
