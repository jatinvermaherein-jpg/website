# Jatin — the WEBSITE on Netlify. The CREW bus runs on Railway.
#
# Dashboard talks to /api/* same-origin; Netlify proxies it server-side
# to the Railway bus (no CORS, SSE passes through as a plain stream).

[build]
  publish = "apps/web"

[[redirects]]
  from = "/api/*"
  to = "https://website-production-0c80.up.railway.app/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
